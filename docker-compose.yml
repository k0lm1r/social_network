services:

  db:
    image: postgres:17
    container_name: db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    
  keycloak:
    image: quay.io/keycloak/keycloak:26.5
    container_name: keycloak
    command: start-dev
    depends_on:
      - db
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/${KC_DB_NAME}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_HTTP_ENABLED: true
      KC_HOSTNAME: http://localhost:9090
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: true
    ports:
      - "9090:8080"

  identity_backend:
    build:
      context: .
      dockerfile: ./identity_service/Dockerfile
    container_name: identity_backend
    depends_on:
      - db
      - keycloak
    ports:
      - "8080:8081"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - ./app-logs:/app/logs
  
  eureka_server:
    build:
      context: .
      dockerfile: ./eureka_server/Dockerfile
    container_name: eureka_server
    ports:
      - "8083:8083"
  
volumes:
  postgres_data:
  app-logs:
  
