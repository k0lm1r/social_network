services:

  identity-db:
    image: postgres:17
    container_name: identity-db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
  
  subscription-db:
    image: mongo:8.2.7
    container_name: subscription-db
    restart: always
    env_file:
      - .env
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${SUBSCRIPTION_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${SUBSCRIPTION_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - subscription_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username ${SUBSCRIPTION_USERNAME} --password ${SUBSCRIPTION_PASSWORD} --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    
  keycloak:
    image: quay.io/keycloak/keycloak:26.5
    container_name: keycloak
    command: start-dev
    depends_on:
      identity-db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://identity-db:5432/${KC_DB_NAME}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8888:8080"

  identity-service:
    build:
      context: .
      dockerfile: ./identity_service/Dockerfile
    container_name: identity-service
    depends_on:
      identity-db:
        condition: service_healthy
      keycloak:
        condition: service_started
      eureka:
        condition: service_started
    ports:
      - "8082:8082"
    env_file:
      - .env
    environment:
      DB_HOST: identity-db
      DB_PORT: 5432
    volumes:
      - ./app-logs/identity-service:/app/logs
  
  eureka:
    build:
      context: .
      dockerfile: ./eureka_server/Dockerfile
    container_name: eureka
    ports:
      - "8761:8761"

  api-gateway:
    build:
      context: .
      dockerfile: ./api_gateway/Dockerfile
    container_name: api-gateway
    depends_on:
      eureka:
        condition: service_started
      identity-service:
        condition: service_started
    ports:
      - "8080:8081"
    env_file:
      - .env
    volumes:
      - ./app-logs/api-gateway:/app/logs

  subscription-service:
    build:
      context: .
      dockerfile: ./subscription_service/Dockerfile
    container_name: subscription-service
    depends_on:
      eureka: 
        condition: service_started
      subscription-db:
        condition: service_healthy
    ports:
      - "8083:8083"
    env_file:
      - .env
    volumes:
      - ./app-logs/subscription-service:/app/logs
  
volumes:
  postgres_data:
  app-logs:
  subscription_data:
  
