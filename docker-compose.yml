services:

  db:
    image: postgres:17
    container_name: db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - identity_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  identity_backend:
    build:
      context: .
      dockerfile: ./identity_service/Dockerfile
    container_name: identity_backend
    restart: always
    depends_on:
      - db
    ports:
      - "8080:8080"
    env_file:
      - .env
volumes:
  identity_data:
  