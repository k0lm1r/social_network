version: "3.9"

services:

  db:
    image: postgres:18
    container_name: db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - identity_data:/var/lib/postgresql/data

  identity_backend:
    build: .
    container_name: identity_backend
    restart: always
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    env_file:
      - .env
volumes:
  identity_data: