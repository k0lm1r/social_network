spring:
  application:
    name: eureka-server
  cloud:
    service-registry:
      auto-registration:
        enabled: false
server:
  port: 8761
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

management:
  endpoints:
    web:
      exposure:
        include:
        - health
        - info
        - metrics
        - prometheus
  prometheus:
    metrics:
      export:
        enabled: true
