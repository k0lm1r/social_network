global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8081"]

  - job_name: identity-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["identity-service:8082"]

  - job_name: subscription-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["subscription-service:8083"]

  - job_name: feed-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["feed-service:8084"]

  - job_name: eureka-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["eureka:8761"]
