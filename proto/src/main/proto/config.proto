syntax = "proto3";
import "google/protobuf/empty.proto";

option java_package = "com.kolmir.validate_token";
option java_multiple_files = true;
option java_outer_classname = "ValidationService";

message UserResponse {
    int32 id = 1;
    string username = 2;
    string email = 3;
    string role = 4;
}

// Sevice for jwt token validation
service ValidateToken {
    // method that validate token and return user from it
    rpc GetUser (google.protobuf.Empty) returns (UserResponse) {}
}