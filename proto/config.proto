syntax = "proto3";

option java_package = "com.kolmir.validate_token";
option java_multiple_files = true;

message JwtRequest {
    string access_token = 1;
    string refresh_token = 2;
}

message ValidationResponse {
    bool is_valid = 1;
}

// Sevice for jwt token validation
service ValidateToken {
    // method that validate jwt token from keycloak
    rpc IsValid (JwtRequest) returns (ValidationResponse) {}
}