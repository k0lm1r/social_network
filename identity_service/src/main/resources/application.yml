spring:
  jpa:
    hibernate:
      ddl-auto: none
  application:
    name: identity_service
  liquibase:
    change-log: classpath:db/migrations/db.changelog-master.yml
    enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/modsen-social
          jwks-uri: http://localhost:9090/realms/modsen-social/protocol/openid-connect/certs
          clientid: api-gateway
server:
  port: 8081

