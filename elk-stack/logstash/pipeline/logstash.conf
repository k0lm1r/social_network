input {
  tcp {
    port => "${LOGSTASH_PORT:5000}"
    codec => json {
      target => "[app]"
    }
  }

  udp {
    port => "${LOGSTASH_PORT:5000}"
    codec => json {
      target => "[app]"
    }
  }

  beats {
    port => 5044
  }
}

filter {
}

output {
  elasticsearch {
    hosts => ["http://${ELASTIC_HOST:localhost}:${ELASTIC_PORT:9200}"]
    index => "logs-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}